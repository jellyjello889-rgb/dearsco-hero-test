
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DEARSCO | The Mineral Ritual</title>

<style>
* {
  box-sizing: border-box;
}

html {
  margin: 0;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eae1d7;
}

/* 전체 화면 히어로 */
.ds-story {
  position: relative;
  height: 220vh;
}

.ds-stage {
  position: sticky;
  top: 0;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  background: #eae1d7;
}

/* 새로운 4초 썸네일 */
.ds-poster,
.ds-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ds-poster {
  z-index: 0;
}

.ds-video {
  z-index: 1;
  opacity: 0;
  transition: opacity .35s ease;
}

.ds-video.ready {
  opacity: 1;
}

/* 텍스트를 위한 은은한 음영 */
.ds-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: linear-gradient(
    90deg,
    rgba(35,30,26,.35),
    rgba(35,30,26,.08) 65%,
    transparent
  );
  pointer-events: none;
}

/* 브랜드 로고 */
.ds-brand {
  position: absolute;
  z-index: 5;
  top: 7%;
  left: 7%;
  color: white;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 5px;
}

/* 좌측 카피 */
.ds-copy {
  position: absolute;
  z-index: 5;
  left: 8%;
  top: 45%;
  transform: translateY(-50%);
  width: min(560px, 82%);
  color: white;
  text-shadow: 0 2px 12px rgba(0,0,0,.22);
  transition: opacity .3s ease;
}

.ds-label {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 3px;
  line-height: 1.6;
}

.ds-copy h1 {
  font-size: clamp(28px,4.5vw,60px);
  line-height: 1.15;
  font-weight: 400;
  margin: 15px 0;
  letter-spacing: .01em;
}

.ds-desc {
  font-size: 14px;
  line-height: 1.8;
  letter-spacing: .02em;
}

/* 마지막 버튼 */
.ds-button {
  position: absolute;
  z-index: 6;
  left: 8%;
  bottom: 13%;
  padding: 14px 24px;
  border: 1px solid rgba(255,255,255,.85);
  color: white;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px);
  transition:
    opacity .5s ease,
    transform .5s ease,
    visibility .5s ease;
}

.ds-button.visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.ds-footer {
  position: absolute;
  z-index: 5;
  left: 8%;
  right: 8%;
  bottom: 5%;
  display: flex;
  justify-content: space-between;
  color: white;
  font-size: 11px;
  letter-spacing: 2px;
}

/* 다음 컬렉션 영역 */
.ds-collection {
  min-height: 65vh;
  padding: 80px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #51483f;
}

.ds-collection h2 {
  font-size: clamp(30px,5vw,60px);
  font-weight: 400;
}

.ds-collection p {
  letter-spacing: 3px;
  font-size: 12px;
}

/* 모바일 */
@media (max-width:767px) {
  .ds-story {
    height: 200svh;
  }

  .ds-copy {
    left: 7%;
    width: 86%;
  }

  .ds-copy h1 {
    font-size: 30px;
  }

  .ds-brand,
  .ds-button {
    left: 7%;
  }

  .ds-footer {
    left: 7%;
    right: 7%;
  }

  .ds-desc {
    font-size: 13px;
  }
}

@media (prefers-reduced-motion:reduce) {
  .ds-story {
    height: 100svh;
  }

  .ds-video,
  .ds-button,
  .ds-copy {
    transition: none;
  }
}
</style>
</head>

<body>

<section class="ds-story" id="ds-story">
  <div class="ds-stage">

    <!-- 4초 시점의 새 썸네일 -->
    <img
      class="ds-poster"
      src="black-poster-4s.png"
      alt="DEARSCO mineral ritual">

    <!-- 기존 원본 영상 그대로 사용 -->
    <video
      id="ds-film"
      class="ds-video"
      muted
      playsinline
      preload="auto"
      poster="black-poster-4s.png">

      <source
        src="블랙 23초_1080.mp4"
        type="video/mp4">

    </video>

    <div class="ds-overlay"></div>

    <div class="ds-brand">DEARSCO</div>

    <div class="ds-copy">
      <p class="ds-label" id="ds-label">
        THE MINERAL RITUAL
      </p>

      <h1 id="ds-title">
        I AM MUD
      </h1>

      <p class="ds-desc" id="ds-desc">
        Nature-inspired care for your beloved companions.
      </p>
    </div>

    <a
      href="https://dearsco.com/"
      class="ds-button"
      id="ds-button">
      DISCOVER DEARSCO
    </a>

    <div class="ds-footer">
      <span>SCROLL TO DISCOVER ↓</span>
      <span id="ds-counter">01 / 04</span>
    </div>

  </div>
</section>

<section class="ds-collection">
  <p>DEARSCO</p>
  <h2>THE I AM MUD COLLECTION</h2>
  <p>BLACK · WHITE · PINK · GREEN</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
(function () {

  const video = document.getElementById("ds-film");
  const story = document.getElementById("ds-story");

  const label = document.getElementById("ds-label");
  const title = document.getElementById("ds-title");
  const desc = document.getElementById("ds-desc");
  const counter = document.getElementById("ds-counter");
  const button = document.getElementById("ds-button");

  /*
   * 여기서 영상 구간을 변경할 수 있어.
   *
   * 4초부터 시작
   * 17초에서 종료
   *
   * 원본 MP4는 수정하지 않음
   */
  const STORY_START = 4.0;
  const STORY_END = 17.0;

  /*
   * 장면별 문구
   * 추후 이 부분의 글자만 변경 가능
   */
  const scenes = [
    {
      label: "THE MINERAL RITUAL",
      title: "I AM MUD",
      desc: "Nature-inspired care for your beloved companions."
    },
    {
      label: "THE ESSENCE OF NATURE",
      title: "ROSE WATER",
      desc: "A delicate expression of rose water."
    },
    {
      label: "THE SCENT",
      title: "BLANC-D",
      desc: "Soft peach, green tea and floral notes."
    },
    {
      label: "INSPIRED BY NATURE",
      title: "THE MINERAL RITUAL",
      desc: "Discover the beauty of natural inspiration."
    }
  ];

  let currentScene = -1;

  function showScene(index) {
    index = Math.max(
      0,
      Math.min(scenes.length - 1, index)
    );

    if (index === currentScene) return;

    currentScene = index;

    label.textContent = scenes[index].label;
    title.textContent = scenes[index].title;
    desc.textContent = scenes[index].desc;

    counter.textContent =
      String(index + 1).padStart(2, "0") +
      " / 04";
  }

  showScene(0);

  /*
   * 스크롤에 따라 4초~17초만 탐색
   */
  video.pause();

  let targetTime = STORY_START;
  let firstFrameReady = false;
  let frameScheduled = false;
  let scrollProgress = 0;

  function seekVideo() {
    frameScheduled = false;

    if (video.readyState < 1 || video.seeking) {
      return;
    }

    const duration = video.duration;

    if (!Number.isFinite(duration) || duration <= 0) {
      return;
    }

    const end = Math.min(
      STORY_END,
      duration - 0.1
    );

    const wanted = Math.max(
      STORY_START,
      Math.min(targetTime, end)
    );

    if (Math.abs(video.currentTime - wanted) > 0.05) {
      try {
        video.currentTime = wanted;
      } catch (e) {}
    }
  }

  function scheduleSeek() {
    if (frameScheduled) return;

    frameScheduled = true;
    requestAnimationFrame(seekVideo);
  }

  video.addEventListener(
    "loadedmetadata",
    scheduleSeek
  );

  video.addEventListener("seeked", function () {

    if (
      !firstFrameReady &&
      Math.abs(video.currentTime - STORY_START) < 0.25
    ) {
      firstFrameReady = true;
      video.classList.add("ready");
    }

    scheduleSeek();
  });

  if (video.readyState >= 1) {
    scheduleSeek();
  }

  /*
   * 마지막 15%는 영상을 멈춰
   * 브랜드 메시지를 보여주는 구간
   */
  function updateProgress(progress) {

    scrollProgress = Math.max(
      0,
      Math.min(1, progress)
    );

    const videoProgress = Math.min(
      scrollProgress / 0.85,
      1
    );

    targetTime =
      STORY_START +
      videoProgress * (STORY_END - STORY_START);

    const index = Math.min(
      3,
      Math.floor(videoProgress * 4)
    );

    showScene(index);

    button.classList.toggle(
      "visible",
      scrollProgress >= 0.86
    );

    scheduleSeek();
  }

  const reduced = window.matchMedia(
    "(prefers-reduced-motion:reduce)"
  ).matches;

  if (reduced) {
    video.pause();
    return;
  }

  /*
   * GSAP 스크롤 연결
   * 장면 강제 점프 효과 제거
   */
  if (window.gsap && window.ScrollTrigger) {

    gsap.registerPlugin(ScrollTrigger);

    ScrollTrigger.create({
      trigger: story,
      start: "top top",
      end: "bottom bottom",

      onUpdate: function (self) {
        updateProgress(self.progress);
      },

      onRefresh: function (self) {
        updateProgress(self.progress);
      }
    });

  } else {

    /*
     * 외부 스크립트 로드 실패 시
     * 일반 스크롤로 대체
     */
    function fallbackScroll() {
      const available =
        story.offsetHeight - window.innerHeight;

      const progress = available > 0
        ? -story.getBoundingClientRect().top / available
        : 0;

      updateProgress(progress);
    }

    window.addEventListener(
      "scroll",
      fallbackScroll,
      { passive: true }
    );

    fallbackScroll();
  }

})();
</script>

</body>
</html>
