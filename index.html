
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DEARSCO | The Mineral Ritual</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eae1d7;
}

/* 하나의 스크롤 히어로 */
.ds-story {
  position: relative;
  height: 240vh;
}

.ds-stage {
  position: sticky;
  top: 0;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  background: #eae1d7;
}

/* 4초 썸네일을 첫 화면에 표시 */
.ds-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 기존 23초 영상 */
.ds-video,
.ds-product-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ds-video {
  opacity: 0;
}

.ds-video.ready {
  opacity: 1;
}

/* 마지막 제품 장면도 같은 화면 */
.ds-product-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0;
  visibility: hidden;
  background: #eae1d7;
  transition:
    opacity .45s ease,
    visibility .45s ease;
}

.ds-product-layer.visible {
  opacity: 1;
  visibility: visible;
}

.ds-product-video {
  opacity: 0;
}

.ds-product-video.ready {
  opacity: 1;
}

/* 텍스트 가독성 */
.ds-overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: linear-gradient(
    90deg,
    rgba(40,32,27,.38),
    rgba(40,32,27,0) 85%
  );
  pointer-events: none;
}

.ds-brand {
  position: absolute;
  left: 7%;
  top: 7%;
  z-index: 5;
  color: white;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 5px;
  text-shadow: 0 2px 10px #0004;
}

.ds-copy {
  position: absolute;
  left: 8%;
  top: 44%;
  width: min(650px,83%);
  transform: translateY(-50%);
  z-index: 5;
  color: white;
  text-shadow: 0 2px 14px #0005;
}

.ds-label {
  font-size: 12px;
  letter-spacing: 4px;
}

.ds-copy h1 {
  font-size: clamp(35px,6vw,82px);
  line-height: 1.12;
  font-weight: 400;
  margin: 16px 0;
}

.ds-desc {
  font-size: 15px;
  line-height: 1.7;
}

.ds-button {
  position: absolute;
  left: 8%;
  bottom: 13%;
  z-index: 6;
  display: none;
  padding: 15px 25px;
  color: white;
  border: 1px solid white;
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 2px;
}

.ds-button.visible {
  display: inline-block;
}

.ds-footer {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 5%;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  color: white;
  font-size: 11px;
  letter-spacing: 2px;
}

/* 영상 이후 컬렉션 영역 */
.ds-collection {
  min-height: 65vh;
  padding: 80px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #51483f;
}

.ds-collection h2 {
  font-weight: 400;
  font-size: clamp(30px,5vw,65px);
}

.ds-collection p {
  letter-spacing: 3px;
}

/* 모바일 */
@media (max-width:767px) {
  .ds-story {
    height: 230svh;
  }

  .ds-copy {
    left: 7%;
    width: 86%;
  }

  .ds-copy h1 {
    font-size: 40px;
  }

  .ds-brand,
  .ds-button {
    left: 7%;
  }

  .ds-footer {
    left: 7%;
    right: 7%;
  }
}

@media (prefers-reduced-motion:reduce) {
  .ds-story {
    height: 100svh;
  }

  .ds-product-layer {
    transition: none;
  }
}
</style>
</head>

<body>

<section class="ds-story" id="ds-story">
  <div class="ds-stage">

    <!-- 새로운 4초 썸네일 -->
    <img
      class="ds-poster"
      src="black-poster-4s.png"
      alt="DEARSCO mineral ritual">

    <!-- 원본 23초 영상: 4초부터 시작 -->
    <video
      id="ds-film"
      class="ds-video"
      muted
      playsinline
      preload="auto"
      poster="black-poster-4s.png">

      <source
        src="블랙 23초_1080.mp4"
        type="video/mp4">
    </video>

    <!-- 마지막 제품 화면 -->
    <div
      class="ds-product-layer"
      id="product-layer">

      <video
        id="ds-product-film"
        class="ds-product-video"
        muted
        playsinline
        preload="auto">

        <source
          src="블랙 23초_1080.mp4"
          type="video/mp4">
      </video>

    </div>

    <div class="ds-overlay"></div>

    <div class="ds-brand">
      DEARSCO
    </div>

    <div class="ds-copy">

      <p class="ds-label" id="ds-label">
        THE MINERAL RITUAL
      </p>

      <h1 id="ds-title">
        I AM MUD
      </h1>

      <p class="ds-desc" id="ds-desc">
        Nature-inspired care for your beloved companions.
      </p>

    </div>

    <a
      id="ds-button"
      class="ds-button"
      href="https://dearsco.com/">
      DISCOVER DEARSCO
    </a>

    <div class="ds-footer">
      <span>SCROLL TO DISCOVER ↓</span>
      <span id="ds-counter">01 / 05</span>
    </div>

  </div>
</section>

<section class="ds-collection">
  <p>DEARSCO</p>
  <h2>THE I AM MUD COLLECTION</h2>
  <p>BLACK · WHITE · PINK · GREEN</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
(function () {

  const video =
    document.getElementById("ds-film");

  const productVideo =
    document.getElementById("ds-product-film");

  const productLayer =
    document.getElementById("product-layer");

  const story =
    document.getElementById("ds-story");

  const title =
    document.getElementById("ds-title");

  const label =
    document.getElementById("ds-label");

  const desc =
    document.getElementById("ds-desc");

  const counter =
    document.getElementById("ds-counter");

  const button =
    document.getElementById("ds-button");


  /* 영상 재생 구간 설정 */
  const STORY_START = 4.0;
  const STORY_END = 18.4;
  const PRODUCT_FRAME = 22.5;


  /* 5개 장면의 문구 */
  const scenes = [
    {
      title: "I AM MUD",
      label: "THE MINERAL RITUAL",
      desc: "Nature-inspired care for your beloved companions."
    },
    {
      title: "ROSE WATER",
      label: "THE ESSENCE OF NATURE",
      desc: "A delicate expression of rose water."
    },
    {
      title: "BLANC-D",
      label: "THE SCENT",
      desc: "Soft peach, green tea and floral notes."
    },
    {
      title: "INSPIRED BY MINERALS",
      label: "MINERAL ALCHEMY",
      desc: "An expression inspired by mineral care."
    },
    {
      title: "I AM MUD — BLACK",
      label: "DEARSCO",
      desc: "Discover the BLACK collection."
    }
  ];


  let activeScene = -1;

  function showScene(index) {

    index = Math.max(0, Math.min(4,index));

    if (index === activeScene) return;

    activeScene = index;

    const scene = scenes[index];

    title.textContent = scene.title;
    label.textContent = scene.label;
    desc.textContent = scene.desc;

    counter.textContent =
      String(index + 1).padStart(2,"0") + " / 05";

    const isProduct = index === 4;

    productLayer.classList.toggle(
      "visible", isProduct
    );

    button.classList.toggle(
      "visible", isProduct
    );
  }


  showScene(0);


  /* 첫 영상의 시작 위치를 4초로 지정 */
  video.pause();

  let targetTime = STORY_START;
  let frameScheduled = false;
  let firstFrameReady = false;

  function seekVideo() {

    frameScheduled = false;

    if (video.readyState < 1 || video.seeking) {
      return;
    }

    const duration = video.duration;

    if (!Number.isFinite(duration) || duration <= 0) {
      return;
    }

    const wanted = Math.min(
      Math.max(STORY_START,targetTime),
      Math.min(STORY_END,duration - .1)
    );

    if (Math.abs(video.currentTime - wanted) > .07) {
      try {
        video.currentTime = wanted;
      } catch(e) {}
    }
  }

  function scheduleSeek() {
    if (frameScheduled) return;

    frameScheduled = true;
    requestAnimationFrame(seekVideo);
  }

  video.addEventListener(
    "loadedmetadata",
    scheduleSeek
  );

  video.addEventListener("seeked", function() {

    if (!firstFrameReady) {
      firstFrameReady = true;
      video.classList.add("ready");
    }

    scheduleSeek();
  });

  if (video.readyState >= 1) {
    scheduleSeek();
  }


  /* 제품 프레임 미리 준비 */
  productVideo.pause();

  let productReady = false;

  function prepareProduct() {

    const duration = productVideo.duration;

    if (!Number.isFinite(duration) || duration <= 0) {
      return;
    }

    const time = Math.min(
      PRODUCT_FRAME,
      duration - .1
    );

    try {
      productVideo.currentTime = time;
    } catch(e) {}
  }

  productVideo.addEventListener(
    "loadedmetadata",
    prepareProduct
  );

  productVideo.addEventListener(
    "seeked",
    function () {

      if (!productReady) {
        productReady = true;
        productVideo.classList.add("ready");
      }

      productVideo.pause();
    }
  );

  if (productVideo.readyState >= 1) {
    prepareProduct();
  }


  /* 움직임 감소 설정 */
  const reduced = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  if (reduced) {
    video.pause();
    return;
  }


  /* GSAP을 불러오지 못한 경우 */
  if (!window.gsap || !window.ScrollTrigger) {

    video.addEventListener(
      "loadedmetadata",
      function () {
        video.currentTime = STORY_START;
      }
    );

    return;
  }


  gsap.registerPlugin(ScrollTrigger);


  /* 스크롤과 영상 시간 연결 */
  ScrollTrigger.create({

    trigger: story,

    start: "top top",

    end: "bottom bottom",

    snap: {
      snapTo: [0,.2,.4,.6,.8,1],
      duration: {min:.12,max:.25},
      delay: .07,
      ease: "power1.inOut"
    },

    onUpdate: function(self) {

      const progress = self.progress;

      const index = Math.min(
        4,
        Math.floor(progress * 5)
      );

      showScene(index);

      if (index < 4) {

        const storyProgress =
          Math.min(progress / .8,1);

        targetTime =
          STORY_START +
          storyProgress *
          (STORY_END - STORY_START);

        scheduleSeek();
      }
    }

  });

})();
</script>

</body>
</html>
